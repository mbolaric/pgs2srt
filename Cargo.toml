[package]
name = "pgs2srt"
version = "0.1.0"
authors = ["Milan Bolaric"]
edition = "2021"

description = "Convert Presentation Graphic Stream (SUP files) into SRT File"

keywords = ["SubTitle", "SUP", "PGS"]

[dependencies]
log = { version = "0.4.33", features = ["max_level_debug", "release_max_level_warn"] }
log4rs = "1.4.0"
clap = { version = "4.6.3", features = ["derive"] }
tiff = "0.11.3"
tesseract = "0.15.2"
tesseract-plumbing = { version = "0.11.1", default-features = false }

indicatif  = "0.18.6"

pgs  = { package = "pgs-parse", version = "0.1.1" }

[[bin]]
name = "pgs2srt"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "symbols"
