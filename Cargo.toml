[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]
default-members = [
    "crates/pgs-core",
    "crates/ui-egui",
    "apps/pgs2srt",
    "apps/pgs2srt-desktop",
]

[workspace.package]
version = "0.1.3"
authors = ["Milan Bolaric"]
edition = "2021"
license = "MIT"
description = "Convert Presentation Graphic Stream (SUP files) into SRT File"
keywords = ["SubTitle", "SUP", "PGS", "SRT"]
repository = "https://github.com/mbolaric/pgs2srt"

[workspace.dependencies]
pgs-core = { path = "crates/pgs-core" }
ui-egui = { path = "crates/ui-egui" }
pgs = { package = "pgs-parse", version = "0.1.3" }
tiff = "0.11.3"
tesseract = "0.15.2"
tesseract-plumbing = { version = "0.11.1", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
indicatif = "0.18.6"
log = { version = "0.4.33", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
log4rs = { version = "1.4.0", default-features = false, features = [
    "console_appender",
    "rolling_file_appender",
    "compound_policy",
    "size_trigger",
    "fixed_window_roller",
    "pattern_encoder",
] }
egui = "0.37"
eframe = { version = "0.37", default-features = false }
# Same major as eframe's own winit; only used to pick the X11 backend on Linux.
winit = { version = "0.30.13", default-features = false }
rfd = "0.17"
crossbeam-channel = "0.5"
sha1 = "0.10.6"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "symbols"
