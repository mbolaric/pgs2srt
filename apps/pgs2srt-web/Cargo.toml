[package]
name = "pgs2srt-web"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "pgs2srt in the browser"

# Built with trunk for wasm32-unknown-unknown; native builds only get a stub `main`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
pgs-core = { workspace = true }
pgs-ocr = { workspace = true, features = ["web"] }
ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow"] }
egui = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
zip = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Node",
    "Storage",
    "Url",
    "Window",
] }

[[bin]]
name = "pgs2srt-web"
path = "src/main.rs"
