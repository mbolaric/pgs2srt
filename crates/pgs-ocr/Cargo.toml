[package]
name = "pgs-ocr"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "OCR engine abstraction for pgs2srt with a Tesseract backend"

[features]
default = ["tesseract"]
tesseract = ["dep:tesseract-plumbing", "dep:sha1", "dep:ureq"]

[dependencies]
tesseract-plumbing = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
