[package]
name = "pgs-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for parsing PGS subtitles, image extraction, and SRT generation"

[features]
default = ["native"]
native = ["pgs-ocr/tesseract", "dep:log4rs", "dep:pollster"]

[dependencies]
pgs = { workspace = true }
pgs-ocr = { workspace = true }
log = { workspace = true }
log4rs = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[dev-dependencies]
pollster = { workspace = true }
